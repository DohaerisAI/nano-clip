name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Build from source, test, install and uninstall on clean machines of every
  # supported system, the way users do it.  The tests also compare the mouse
  # wheel with the system's own (unpatched) nano of the same version.
  source:
    name: from source on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 22.04 (nano 6.2), runner: ubuntu-24.04, container: 'ubuntu:22.04' }
          - { name: Ubuntu 24.04 (nano 7.2), runner: ubuntu-24.04, container: 'ubuntu:24.04' }
          - { name: Ubuntu 24.04 arm64 (nano 7.2), runner: ubuntu-24.04-arm, container: 'ubuntu:24.04' }
          - { name: Debian 12 (nano 7.2), runner: ubuntu-24.04, container: 'debian:12' }
          - { name: Ubuntu 26.04 (nano 8.7.1), runner: ubuntu-24.04, container: 'ubuntu:26.04' }
    steps:
      - name: Prepare the container (with the system's own nano, for comparison)
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 curl nano > /dev/null

      - uses: actions/checkout@v4

      - name: Build, test and install for the current user
        run: ./install.sh --from-source

      - name: Check, then uninstall
        run: |
          "$HOME/.local/bin/nano" --version | head -n 1
          grep -q 'added by nano-mouse' "$HOME/.nanorc"
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/nano"
          ! grep -qs 'added by nano-mouse' "$HOME/.nanorc"

      - name: Install system-wide, check, and uninstall
        run: |
          ./install.sh --system --from-source --skip-tests
          /usr/local/bin/nano --version | head -n 1
          ./uninstall.sh --system
          test ! -e /usr/local/bin/nano

  # The proposal for upstream nano: build nano's git master (at the commit that
  # the patches are based on) with the patch series, using nano's own autogen.sh,
  # and run the tests in "upstream" mode against an unpatched build of the same.
  upstream:
    name: nano master + upstream/ patches on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, container: '' }
          - { name: Fedora Rawhide, container: 'fedora:rawhide' }
          - { name: Debian unstable, container: 'debian:sid' }
    steps:
      - name: Install the build tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y -q git gcc make autoconf automake gettext-devel ncurses-devel \
                texinfo groff python3 coreutils diffutils
          else
            sudo=$([ "$(id -u)" -eq 0 ] || echo sudo)
            $sudo apt-get update -qq
            $sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential \
                autoconf automake autopoint gettext libncurses-dev pkg-config texinfo groff python3
          fi

      - uses: actions/checkout@v4

      - name: Get nano's git master at the base commit of the patches
        run: |
          base=$(sed -n 's/^base-commit: //p' upstream/0001-*.patch)
          git clone -q https://git.savannah.gnu.org/git/nano.git "$RUNNER_TEMP/nano"
          git -C "$RUNNER_TEMP/nano" checkout -q "$base"
          git -C "$RUNNER_TEMP/nano" log -1 --format='%h %ad %s' --date=short

      - name: Build unpatched nano (for the "same as stock" checks)
        working-directory: ${{ runner.temp }}/nano
        run: |
          ./autogen.sh > /dev/null
          ./configure -q && make -s -j"$(nproc)" > /dev/null
          cp src/nano "$RUNNER_TEMP/nano-stock"

      - name: Apply the patches and build again
        working-directory: ${{ runner.temp }}/nano
        run: |
          git -c user.name=ci -c user.email=ci@localhost am -q "$GITHUB_WORKSPACE"/upstream/*.patch
          make -s -j"$(nproc)" > /dev/null
          src/nano --version | head -n 1

      - name: Run the tests
        run: |
          FLAVOR=upstream NANO="$RUNNER_TEMP/nano/src/nano" STOCK_NANO="$RUNNER_TEMP/nano-stock" \
            python3 tests/nanotest.py | tee tests.log
          ! grep -q '^FAIL' tests.log

  # On a version tag: build the ready-made binaries, each on the system it is
  # meant for (so it links against that system's libraries).
  binary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: source
    name: binary nano ${{ matrix.nano }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        nano: ['6.2', '7.2', '8.7.1']
        arch: [x86_64, arm64]
        include:
          - { nano: '6.2', container: 'ubuntu:22.04' }
          - { nano: '7.2', container: 'debian:12' }   # older glibc: also runs on Ubuntu 24.04
          - { nano: '8.7.1', container: 'ubuntu:26.04' }
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 curl > /dev/null
      - uses: actions/checkout@v4

      - name: Build, test and install into /usr inside the container
        # With --prefix /usr, the binary uses the system's nano translations.
        run: ./install.sh --from-source --prefix /usr

      - name: Package
        run: |
          name="nano-mouse-nano${{ matrix.nano }}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp /usr/bin/nano LICENSE "$name/"
          cp packaging/BINARY-README.txt "$name/README.txt"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.nano }}-${{ matrix.arch }}
          path: nano-mouse-*.tar.gz*

  # Install each ready-made binary with install.sh on a clean machine of its
  # system, then run all the tests against it.
  verify:
    needs: binary
    name: verify binary on ${{ matrix.container }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'ubuntu:26.04']
        arch: [x86_64, arm64]
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 curl nano > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - name: Install the binary like the one-line installer does
        run: NANO_MOUSE_RELEASES="file://$PWD/release" ./install.sh
      - name: Run the tests against it
        run: |
          NANO="$HOME/.local/bin/nano" STOCK_NANO=/usr/bin/nano python3 tests/nanotest.py | tee tests.log
          ! grep -q '^FAIL' tests.log

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nano-mouse-*.tar.gz nano-mouse-*.tar.gz.sha256 \
            --title "nano-mouse ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE-NOTES.md

  # Finally, run the real one-line command on each system, as a user would:
  # after a release, and also on every push (against the latest release).
  one-liner:
    needs: [source, release]
    if: ${{ !cancelled() && needs.source.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.release.result) }}
    name: one-line install on ${{ matrix.container }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'ubuntu:26.04']
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates > /dev/null
      # The script is piped into bash exactly as with "curl ... | bash", but from
      # this commit, as raw.githubusercontent.com may serve a cached older copy.
      - uses: actions/checkout@v4
      - name: '... | bash'
        run: |
          bash < install.sh
          "$HOME/.local/bin/nano" --version | head -n 1
      - name: Uninstall the same way
        run: |
          bash < uninstall.sh
          test ! -e "$HOME/.local/bin/nano"
