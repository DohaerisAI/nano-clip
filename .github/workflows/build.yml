name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Install, test and uninstall on clean machines, the way users do it.
  install:
    name: install on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04 x86_64, runner: ubuntu-24.04, container: '' }
          - { name: Ubuntu 24.04 arm64, runner: ubuntu-24.04-arm, container: '' }
          - { name: Debian 12 x86_64, runner: ubuntu-24.04, container: 'debian:12' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the Debian container
        if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq git python3

      - uses: actions/checkout@v4

      - name: Install for the current user (builds and runs the tests)
        run: ./install.sh

      - name: Check the per-user install
        run: |
          "$HOME/.local/bin/nano" --version | head -n 1
          "$HOME/.local/bin/nano" --version | grep -q 'version 7.2'

      - name: Uninstall the per-user install
        run: |
          ./uninstall.sh
          test ! -e "$HOME/.local/bin/nano"

      - name: Install system-wide
        run: ./install.sh --system --skip-tests

      - name: Check and uninstall the system-wide install
        run: |
          /usr/local/bin/nano --version | head -n 1
          ./uninstall.sh --system
          test ! -e /usr/local/bin/nano

  # The proposal for upstream nano: build nano's git master (at the commit that
  # the patches are based on) with the patch series, using nano's own autogen.sh,
  # and run the tests in "upstream" mode against an unpatched build of the same.
  upstream:
    name: nano master + upstream/ patches on ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 24.04, container: '' }
          - { name: Fedora Rawhide, container: 'fedora:rawhide' }
          - { name: Debian unstable, container: 'debian:sid' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build tools
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y -q git gcc make autoconf automake gettext-devel ncurses-devel \
                texinfo groff python3 coreutils diffutils
          else
            sudo=$([ "$(id -u)" -eq 0 ] || echo sudo)
            $sudo apt-get update -qq
            $sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential \
                autoconf automake autopoint gettext libncurses-dev pkg-config texinfo groff python3
          fi

      - uses: actions/checkout@v4

      - name: Get nano's git master at the base commit of the patches
        run: |
          base=$(sed -n 's/^base-commit: //p' upstream/0001-*.patch)
          git clone -q https://git.savannah.gnu.org/git/nano.git "$RUNNER_TEMP/nano"
          git -C "$RUNNER_TEMP/nano" checkout -q "$base"
          git -C "$RUNNER_TEMP/nano" log -1 --format='%h %ad %s' --date=short

      - name: Build unpatched nano (for the "same as stock" checks)
        working-directory: ${{ runner.temp }}/nano
        run: |
          ./autogen.sh > /dev/null
          ./configure -q && make -s -j"$(nproc)" > /dev/null
          cp src/nano "$RUNNER_TEMP/nano-stock"

      - name: Apply the patches and build again
        working-directory: ${{ runner.temp }}/nano
        run: |
          git -c user.name=ci -c user.email=ci@localhost am -q "$GITHUB_WORKSPACE"/upstream/*.patch
          make -s -j"$(nproc)" > /dev/null
          src/nano --version | head -n 1

      - name: Run the tests
        run: |
          FLAVOR=upstream NANO="$RUNNER_TEMP/nano/src/nano" STOCK_NANO="$RUNNER_TEMP/nano-stock" \
            python3 tests/nanotest.py | tee tests.log
          ! grep -q '^FAIL' tests.log

  # On a version tag, build ready-made binaries.  They are built on Debian 12
  # (the older glibc), so they run on both Debian 12 and Ubuntu 24.04.
  binary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    name: binary for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:12
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git python3
      - uses: actions/checkout@v4

      - name: Build, test and install into /usr inside the container
        # With --prefix /usr the binary uses the system's nano translations.
        run: ./install.sh --prefix /usr

      - name: Package
        run: |
          name="nano-mouse-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp /usr/bin/nano LICENSE "$name/"
          cp packaging/BINARY-README.txt "$name/README.txt"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: nano-mouse-*.tar.gz*

  # Check the ready-made binaries on clean Ubuntu 24.04 machines.
  verify:
    needs: binary
    name: verify binary on Ubuntu 24.04 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
      - name: Run the tests against the downloaded binary
        run: |
          sha256sum -c nano-mouse-*.tar.gz.sha256
          tar -xzf nano-mouse-*.tar.gz
          NANO="$(echo "$PWD"/nano-mouse-*/nano)" python3 tests/nanotest.py | tee tests.log
          ! grep -q '^FAIL' tests.log

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nano-mouse-*.tar.gz nano-mouse-*.tar.gz.sha256 \
            --title "nano-mouse ${GITHUB_REF_NAME#v} (for GNU nano 7.2)" \
            --notes-file packaging/RELEASE-NOTES.md
